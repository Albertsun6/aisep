name: gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/aisep.py gate
  # aisep-mcp/tests 的 pytest（Albert 2026-11-20 拍板：负例除外）。
  # test_merge_check_negatives.py 单跑约 21 分钟，等提速后再纳入；在那之前，涉及 mergecheck 的 PR 合并前须在本地跑它。
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -p no:cacheprovider aisep-mcp/tests --ignore=aisep-mcp/tests/test_merge_check_negatives.py
      # 元模型夹具（modules/*/tests）+ tests/acceptance/*.py；aisep-mcp/tests 已由上一步跑，这里 --no-pytest 跳过
      - run: python tools/aisep.py test --no-pytest
  # §5.9 合并时校验（切片 S6）。单独一个 job，先不列为必需检查（必需的仍只有 gate）。
  # 口径：H = pull_request.head.sha（不用 GITHUB_SHA）；T = 刚 fetch 的远端主分支；M 在 T 上本地合并生成。
  mergecheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: fetch the current target branch and the PR head
        run: |
          git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.event.pull_request.head.sha }}"
      - run: python -m aisep.mergecheck --github-event "$GITHUB_EVENT_PATH"
